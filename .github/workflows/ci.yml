name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # aws-lc-sys's release build uses x86 assembly and needs these.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake nasm perl

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release, matches production)
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [explorer, light-wallet, faucet]
    defaults:
      run:
        working-directory: examples/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.project }}/package-lock.json
      - run: npm ci
      # The faucet imports light-wallet sources, whose own imports TypeScript
      # resolves against light-wallet's node_modules.
      - name: Install light-wallet dependencies
        if: matrix.project == 'faucet'
        run: npm ci
        working-directory: examples/light-wallet
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
