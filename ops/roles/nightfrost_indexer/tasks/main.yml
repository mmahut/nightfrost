---
- name: Check the locally built nightfrost binary on the controller
  ansible.builtin.stat:
    path: "{{ nightfrost_binary_source }}"
  delegate_to: localhost
  become: false
  register: nightfrost_binary

- name: Require a local release build
  ansible.builtin.assert:
    that:
      - nightfrost_binary.stat.exists
      - nightfrost_binary.stat.isreg
    fail_msg: >-
      Missing {{ nightfrost_binary_source }}. Build locally with
      ops/build-linux.sh before running this playbook.

- name: Create indexer data directories
  ansible.builtin.file:
    path: "{{ nightfrost_root }}/data-{{ item.network }}"
    state: directory
    owner: "{{ nightfrost_user }}"
    group: "{{ nightfrost_group }}"
    mode: "0750"
  loop: "{{ nightfrost_indexers }}"

- name: Install the locally built nightfrost binary
  ansible.builtin.copy:
    src: "{{ nightfrost_binary_source }}"
    dest: /usr/local/bin/nightfrost
    owner: root
    group: root
    mode: "0755"
  notify:
    - Reload systemd for indexers
    - Restart indexers

- name: Verify the installed binary executes on the production host
  ansible.builtin.command: /usr/local/bin/nightfrost --help
  changed_when: false

- name: Install indexer environment file
  ansible.builtin.template:
    src: nightfrost.env.j2
    dest: "{{ nightfrost_config_dir }}/indexer.env"
    owner: root
    group: root
    mode: "0600"
  notify:
    - Reload systemd for indexers
    - Restart indexers

- name: Install indexer systemd units
  ansible.builtin.template:
    src: nightfrost.service.j2
    dest: "/etc/systemd/system/nightfrost-{{ item.network }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nightfrost_indexers }}"
  notify:
    - Reload systemd for indexers
    - Restart indexers

- name: Enable and start indexers
  ansible.builtin.systemd:
    name: "nightfrost-{{ item.network }}.service"
    enabled: true
    state: started
  loop: "{{ nightfrost_indexers }}"

- name: Apply unit and binary changes before health checks
  ansible.builtin.meta: flush_handlers

- name: Wait for each indexer API to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.listen_port }}/api/v0/sync-status"
    method: GET
    status_code: 200
    timeout: 5
  loop: "{{ nightfrost_indexers }}"
  register: indexer_health
  retries: 20
  delay: 5
  until: indexer_health.status | default(0) == 200
