---
- name: Check the local explorer build on the controller
  ansible.builtin.stat:
    path: "{{ nightfrost_explorer_source }}/index.html"
  delegate_to: localhost
  become: false
  register: nightfrost_explorer_build

- name: Require a local explorer build
  ansible.builtin.assert:
    that:
      - nightfrost_explorer_build.stat.exists
      - nightfrost_explorer_build.stat.isreg
    fail_msg: >-
      Missing {{ nightfrost_explorer_source }}/index.html. Build the explorer
      locally with ops/build-explorer.sh before running this playbook.

- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create the explorer document root
  ansible.builtin.file:
    path: "{{ nightfrost_explorer_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the explorer static files
  ansible.builtin.copy:
    src: "{{ nightfrost_explorer_source }}/"
    dest: "{{ nightfrost_explorer_root }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Create the landing and docs document roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nightfrost_landing_root }}"
    - "{{ nightfrost_docs_root }}"

- name: Install the landing static files
  ansible.builtin.copy:
    src: "{{ nightfrost_landing_source }}/"
    dest: "{{ nightfrost_landing_root }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Install the docs static files
  ansible.builtin.copy:
    src: "{{ nightfrost_docs_source }}/"
    dest: "{{ nightfrost_docs_root }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Read SELinux mode
  ansible.builtin.command: getenforce
  register: nginx_selinux_mode
  changed_when: false
  failed_when: false

- name: Permit Nginx to proxy to local indexers under SELinux
  ansible.builtin.command: setsebool -P httpd_can_network_connect 1
  when: nginx_selinux_mode.stdout | trim == 'Enforcing'

- name: Restore SELinux labels on explorer, landing and docs files
  ansible.builtin.command: restorecon -RFv "{{ item }}"
  loop:
    - "{{ nightfrost_explorer_root }}"
    - "{{ nightfrost_landing_root }}"
    - "{{ nightfrost_docs_root }}"
  when: nginx_selinux_mode.stdout | trim == 'Enforcing'
  changed_when: false

- name: Install nightfrost virtual hosts
  ansible.builtin.template:
    src: nightfrost.conf.j2
    dest: /etc/nginx/conf.d/nightfrost.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install explorer virtual host
  ansible.builtin.template:
    src: explorer.conf.j2
    dest: /etc/nginx/conf.d/nightfrost-explorer.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install landing virtual host
  ansible.builtin.template:
    src: landing.conf.j2
    dest: /etc/nginx/conf.d/nightfrost-landing.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install docs virtual host
  ansible.builtin.template:
    src: docs.conf.j2
    dest: /etc/nginx/conf.d/nightfrost-docs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate Nginx configuration before starting it
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
