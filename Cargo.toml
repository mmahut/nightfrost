[workspace]
resolver = "2"
members = [
    "crates/nightfrost-core",
    "crates/nightfrost-chain",
    "crates/nightfrost-api",
    "crates/nightfrost",
]

[workspace.package]
version    = "0.1.1"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/mmahut/nightfrost"
publish    = false

[workspace.dependencies]
nightfrost-core  = { path = "crates/nightfrost-core" }
nightfrost-chain = { path = "crates/nightfrost-chain" }
nightfrost-api   = { path = "crates/nightfrost-api" }

# Ledger crates, all from crates.io, pinned to exactly what midnight-node
# `node-2.1.101` (the live 2.1 network) resolves. Every block's ledger root is
# checked against the node's, so replay has to run the node's exact ledger
# code: with ledger 9.1.0.0-rc.6, preview block 10067's contract call ran out
# of gas in replay while the node applied it; 9.1.0.1 (onchain-vm 4.0.1 changed
# gas charging) replays it as the node does. Re-diff this list against the
# node's Cargo.lock whenever the network's node release moves.
#
# Shared by both ledger majors.
midnight-base-crypto_v1      = { package = "midnight-base-crypto", version = "=1.1.1" }
midnight-serialize_v1        = { package = "midnight-serialize", version = "=1.2.1" }
# One storage-core, so the v8 and v9 states share one arena.
midnight-storage-core_v1     = { package = "midnight-storage-core", version = "=1.2.3" }
# Ledger v8.
midnight-coin-structure_v2   = { package = "midnight-coin-structure", version = "=2.0.2" }
midnight-ledger_v8           = { package = "midnight-ledger", version = "=8.1.3" }
midnight-onchain-runtime_v3  = { package = "midnight-onchain-runtime", version = "=3.1.2" }
midnight-onchain-state_v3    = { package = "midnight-onchain-state", version = "=3.0.2" }
midnight-transient-crypto_v2 = { package = "midnight-transient-crypto", version = "=2.2.0" }
midnight-zswap_v8            = { package = "midnight-zswap", version = "=8.1.3" }
# Ledger v9 (ledger 9.1.0.1). storage went to a new major; it also hosts the
# v8 -> v9 translation machinery (`state-translation`).
midnight-coin-structure_v3   = { package = "midnight-coin-structure", version = "=3.0.1" }
midnight-ledger_v9           = { package = "midnight-ledger-v9", version = "=1.0.1" }
midnight-onchain-runtime_v4  = { package = "midnight-onchain-runtime", version = "=4.0.1" }
midnight-onchain-state_v4    = { package = "midnight-onchain-state", version = "=4.0.1" }
midnight-storage_v3          = { package = "midnight-storage", version = "=3.0.0", features = ["state-translation"] }
# v8-side storage, only for tests that name v8 trie types (they sit behind
# `public-internal-structure`).
midnight-storage_v2          = { package = "midnight-storage", version = "=2.0.5", features = ["public-internal-structure"] }
midnight-transient-crypto_v3 = { package = "midnight-transient-crypto", version = "=3.0.1" }
midnight-zswap_v9            = { package = "midnight-zswap", version = "=9.0.1" }
# The ledger team's v8 -> v9 translation table. Unpublished, so pinned by the
# same git tag as the node.
v8-to-v9-state-translation   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "state-translation-v8-v9-node-2.1.101" }

anyhow             = { version = "1.0" }
async-stream       = { version = "0.3" }
axum               = { version = "0.8" }
base64             = { version = "0.22" }
bech32             = { version = "0.12" }
clap               = { version = "4.6" }
const-hex          = { version = "1.18" }
derive_more        = { version = "2.1" }
fjall              = { version = "2" }
futures            = { version = "0.3" }
http               = { version = "1" }
hmac               = { version = "0.13" }
itertools          = { version = "0.15" }
parity-scale-codec = { version = "3.7" }
postcard           = { version = "1", features = ["use-std"] }
serde              = { version = "1.0" }
serde_json         = { version = "1.0" }
sha2               = { version = "0.11" }
subxt              = { version = "0.50" }
subtle             = { version = "2.6" }
thiserror          = { version = "2.0" }
tokio              = { version = "1" }
tower-http         = { version = "0.7", features = ["cors"] }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[patch.crates-io]
# fjall 2.11.2 vendored with added journal-eviction/recovery diagnostics
# (PATCHED(nightfrost) markers) after a production write-halt livelock;
# drop when upgrading to fjall 3, which rewrote the stall bookkeeping.
fjall                         = { path = "vendor/fjall" }

[profile.release]
lto = "thin"
